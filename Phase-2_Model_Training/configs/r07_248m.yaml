run:
  name: geninherit_r07_248m
  seed: 1337
  session_hours: 11.0

model:
  vocab_size: 4096
  d_model: 1024
  n_layers: 22           # Rung 7: 22 layers (248.1M parameters)
  n_heads: 16
  n_kv_heads: 4
  head_dim: 64
  d_ff: 2752
  max_seq_len: 2048
  rope_base: 10000.0
  n_slots: 128
  n_gens: 16
  n_fields: 64
  n_fourier_frequencies: 8
  qk_norm: true

optim:
  peak_lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 250
  micro_batch: 4
  accum: 16
  total_tokens: 250000000

loss:
  lambda_inv: 0.2
  lambda_z: 1.0e-4

eval:
  eval_every: 250
  ckpt_every: 250

